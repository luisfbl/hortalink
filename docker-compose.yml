services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.template.conf:/etc/nginx/conf.d/nginx.template
    env_file:
      - ./.env
    command: [ "/bin/sh" , "-c" , "envsubst < /etc/nginx/conf.d/nginx.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'" ]
    environment:
      - D=$
    networks:
      - hortalink_network
    depends_on:
      rest-server:
        condition: service_started
      cdn-server:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "${DEFAULT_PROXY_PORT}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 10s
      retries: 3

  rest-server:
    build:
      context: .
      dockerfile: ./rest-server/Dockerfile
    env_file:
      - ./.env
    volumes:
      - cdn_data:/data/cdn_storage
    networks:
      - hortalink_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: ./web/Dockerfile
    env_file:
      - ./.env
    networks:
      - hortalink_network
    restart: unless-stopped

  cdn-server:
    build:
      context: .
      dockerfile: ./cdn-server/Dockerfile
    env_file:
      - ./.env
    volumes:
      - cdn_data:/data/cdn_storage
    networks:
      - hortalink_network
    restart: unless-stopped

  websocket:
    build:
      context: .
      dockerfile: ./websocket/Dockerfile
    env_file:
      - ./.env
    networks:
      - hortalink_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgis/postgis:15-3.4
    container_name: hortalink_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:${DB_PORT}"
    networks:
      - hortalink_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}
  cdn_data: {}

networks:
  hortalink_network:
    driver: bridge